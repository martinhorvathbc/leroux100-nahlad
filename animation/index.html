:root{--bg:#080504;--panel:#120b08;--gold:#d6aa5c;--gold2:#efcc8a;--ink:#f3e6cb;--mute:#b1a38a;--edge:#7a5a30;--burg:#6f0f1d;--velvet:#2e0810;--teal:#8fd0c0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Inter,system-ui,"Segoe UI",sans-serif;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#1c120d 0%,#0b0605 55%,#080504 100%)}
.wrap{width:min(calc(100vw - 32px),calc((100vh - 104px)*16/9));margin:0 auto;padding-top:12px}
.stage{position:relative;border:1px solid #3b230c;border-radius:10px;background:linear-gradient(180deg,#0d0807,#090504);box-shadow:inset 0 0 0 4px #0b0605,inset 0 0 0 5px #2a1d14,0 18px 50px rgba(0,0,0,.45);overflow:hidden}
svg#sc{display:block;width:100%;height:auto}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 4px}
button{font:600 13px/1 Inter,system-ui,"Segoe UI",sans-serif;color:var(--ink);background:#1a110c;border:1px solid var(--edge);border-radius:6px;padding:9px 12px;cursor:pointer;min-height:36px}
button:hover{border-color:var(--gold)}
button.on{background:var(--burg);border-color:var(--gold);color:#fff3d0}
.chap{display:flex;flex-wrap:wrap;gap:6px}
input[type=range]{width:100%;accent-color:var(--gold);margin:6px 0 12px}
.sp{flex:1 1 auto}
/* SVG */
svg text{font-family:Inter,system-ui,"Segoe UI",sans-serif;fill:var(--ink)}
svg .serif{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif}
.k{font-size:14px;font-weight:600;letter-spacing:.26em;fill:var(--gold)}
.h{font-size:40px;font-weight:600;fill:var(--ink)}
.sub{font-size:17px;fill:var(--mute)}
.lab{font-size:15px;fill:var(--ink)}
.sm{font-size:13.5px;fill:var(--mute)}
.xs{font-size:12px;fill:#9e8b68}
.num{font-weight:700;fill:var(--gold);font-variant-numeric:lining-nums}
.sc{opacity:0;transition:opacity .9s ease;pointer-events:none}
.sc.cur{opacity:1}
.a{opacity:0;transform:translateY(10px);transform-box:fill-box;transition:opacity .8s ease,transform .8s ease}
.a.on{opacity:1;transform:none}
.dr{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.3s ease}
.dr.on{stroke-dashoffset:0}
.nt .a,.nt .dr,.nt .sc{transition:none!important}
.inv{animation:inv 3.2s ease-in-out infinite}
@keyframes inv{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}
